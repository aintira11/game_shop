<div class="login-header">
  <div class="brand">GameShop</div>
</div>

<body>
  <div class="login-page">
    <div class="login-left">
      <h2>Get Started Now</h2>

      <div class="avatar-block">
        <div class="avatar">
          <img [src]="avatarSrc" alt="Avatar" />
        </div>
        <input #fileInput type="file" accept="image/*" hidden (change)="onAvatarSelected($event)" />
        <button type="button" class="add-photo" (click)="fileInput.click()">Add a photo</button>
      </div>

      <!-- Error message -->
      <div *ngIf="errorMessage" class="error-message">
        {{ errorMessage }}
      </div>

      <form class="login-form" (ngSubmit)="register()">
        <label>Name</label>
        <input 
          type="text" 
          placeholder="Your name" 
          [(ngModel)]="username" 
          name="username"
          required 
        />

        <label>Email</label>
        <input 
          type="email" 
          placeholder="Your email" 
          [(ngModel)]="email" 
          name="email"
          required 
        />

        <label>Password</label>
        <input 
          type="password" 
          placeholder="Password" 
          [(ngModel)]="password" 
          name="password"
          required 
        />

        <button 
          type="submit" 
          [disabled]="isLoading"
        >
          {{ isLoading ? 'กำลังสมัครสมาชิก...' : 'Sign up' }}
        </button>

        <div class="signin-cta">
          <span>Have an account?</span>
          <a routerLink="/login" class="signin-link">Sign In</a>
        </div>
      </form>
    </div>

    <div class="login-right">
      <img src="assets/image/chris-lee-70l1tDAI6rM-unsplash%204.png" alt="Login banner" />
    </div>
  </div>
</body>
